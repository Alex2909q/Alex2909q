name: Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["zvukaryk-android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["zvukaryk-android/**"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Створити GitHub Release з цим тегом (наприклад v0.2.0). Порожньо — лише збірка."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zvukaryk-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME); AGP downloads any missing platform/build-tools.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK (installable, for testing)
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        # Signed with the upload keystore when secrets are set; otherwise falls back to the debug key (still installable).
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          fi
          ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zvukaryk-debug-apk
          path: zvukaryk-android/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: zvukaryk-release-apk
          path: zvukaryk-android/app/build/outputs/apk/release/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: zvukaryk-android/app/build/reports/tests/

      - name: Name APKs for the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          V="${TAG#v}"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/zvukaryk-$V.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release/zvukaryk-$V-debug.apk"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Звукарик ${{ inputs.release_tag || github.ref_name }}
          files: |
            zvukaryk-android/release/*.apk
          generate_release_notes: true
